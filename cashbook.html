<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashbook - Nazeer Fresh Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex h-screen" onload="loadData()">
    <div class="w-64 bg-gray-900 text-white flex flex-col h-full shrink-0">
        <div class="p-4 text-xl font-bold border-b border-gray-700">Nazeer Fresh Food</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Billing</a>
            <a href="bill-to.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Bill To</a>
            <a href="deliver-to.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Deliver To</a>
            <a href="cashbook.html" class="block p-2 bg-blue-600 rounded text-white">Cashbook</a>
            <a href="credit-book.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Credit Book</a>
        </nav>
    </div>

    <div class="flex-1 flex flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6 text-green-700">Cashbook Ledger</h2>
        <div class="bg-white p-6 rounded shadow">
            <table class="w-full border-collapse border border-gray-300">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="border p-2 text-left">Date</th>
                        <th class="border p-2 text-left">Invoice No</th>
                        <th class="border p-2 text-left">Customer</th>
                        <th class="border p-2 text-right">Cash In (₹)</th>
                    </tr>
                </thead>
                <tbody id="dataTable"><tr><td colspan="4" class="text-center p-4">Loading...</td></tr></tbody>
                <tfoot>
                    <tr class="bg-green-100 font-bold">
                        <td colspan="3" class="border p-2 text-right">Total Cash Sales:</td>
                        <td class="border p-2 text-right text-green-800" id="totalValue">0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient('https://tmrulrlwyspnlwodrjpa.supabase.co', 'sb_publishable_tlacY2KLpvy8YjOYJiCsEA_sP1qA6zS');
        async function loadData() {
            const { data } = await supabaseClient.from('invoices').select('*').eq('payment_mode', 'Cash').order('created_at', { ascending: false });
            let total = 0;
            document.getElementById('dataTable').innerHTML = (data || []).map(inv => {
                total += inv.total_amount;
                return `<tr><td class="border p-2">${new Date(inv.created_at).toLocaleDateString()}</td><td class="border p-2 font-bold">${inv.invoice_number}</td><td class="border p-2">${inv.bill_to_name}</td><td class="border p-2 text-right">₹${inv.total_amount.toFixed(2)}</td></tr>`;
            }).join('');
            document.getElementById('totalValue').innerText = '₹' + total.toFixed(2);
        }
    </script>
</body>
</html>
