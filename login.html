<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nazeer Fresh Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            /* Fresh gradient background suitable for a food market */
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }
        .loader {
            border-top-color: #ffffff;
            -webkit-animation: spinner 1s linear infinite;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .input-with-icon {
            padding-left: 42px;
        }
    </style>
</head>
<body class="flex h-screen items-center justify-center font-sans antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-10 border border-green-50">
        <!-- Header & Logo -->
        <div class="text-center mb-8">
            <div class="mx-auto bg-green-600 text-white w-16 h-16 flex items-center justify-center rounded-full mb-5 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Welcome Back</h1>
            <p class="text-gray-500 text-sm mt-2">Sign in to access Nazeer Fresh Food Market</p>
        </div>

        <!-- Error Message Container -->
        <div id="error-message" class="hidden mb-6 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center font-medium shadow-sm">
            Invalid email or password.
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
                <div class="input-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <!-- Pre-filled Default Admin ID -->
                    <input type="email" id="email" required value="gsmmargao@gmail.com"
                        class="input-with-icon w-full py-2.5 pr-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all text-gray-800 bg-gray-50 focus:bg-white">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                <div class="input-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <!-- Pre-filled Default Password -->
                    <input type="password" id="password" required value="admin123"
                        class="input-with-icon w-full py-2.5 pr-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all text-gray-800 bg-gray-50 focus:bg-white">
                </div>
            </div>

            <button type="submit" id="loginBtn" 
                class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-green-700 active:bg-green-800 shadow-md transition-all flex justify-center items-center gap-2 mt-6">
                <span id="btnText">Sign In</span>
                <div id="btnLoader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full loader"></div>
            </button>
        </form>
        
        <div class="mt-8 text-center text-xs text-gray-400 font-medium">
            &copy; 2026 Nazeer Fresh Foods. All rights reserved.
        </div>
    </div>

    <script>
        // Supabase Configuration
        const supabaseUrl = 'https://cbsmsclmyyxgwwztqwsc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNic21zY2xteXl4Z3d3enRxd3NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3Nzg2MTgsImV4cCI6MjA5OTM1NDYxOH0.emzPs1e_UE-UXZVy5fYJ73GYA_o49C_IYM2EhMqLMxw'; 
        
        // Use supabaseClient to avoid naming conflicts with the global Supabase object
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Check if already logged in when the page loads
        document.addEventListener("DOMContentLoaded", async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                // User is already logged in, redirect to main dashboard
                window.location.href = 'index.html'; 
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorContainer = document.getElementById('error-message');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const loginBtn = document.getElementById('loginBtn');

            // Reset UI State
            errorContainer.classList.add('hidden');
            btnText.innerText = 'Authenticating...';
            btnLoader.classList.remove('hidden');
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                // Attempt to sign in via Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                // Login successful, redirect to main dashboard
                window.location.href = 'index.html'; 

            } catch (error) {
                // Show error message
                errorContainer.innerText = error.message === 'Invalid login credentials' 
                    ? 'Invalid email or password.' 
                    : error.message;
                errorContainer.classList.remove('hidden');
                
                // Reset button state
                btnText.innerText = 'Sign In';
                btnLoader.classList.add('hidden');
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
