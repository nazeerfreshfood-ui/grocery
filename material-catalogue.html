<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Catalogue - Nazeer Fresh Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Sidebar transition styles & Mobile Overlay */
        #sidebar {
            transition: width 0.3s ease, opacity 0.3s ease;
            overflow-x: hidden;
            white-space: nowrap;
            position: absolute;
            z-index: 50;
            height: 100%;
        }
        @media (min-width: 768px) {
            #sidebar {
                position: relative;
            }
        }
        #sidebar.collapsed {
            width: 0 !important;
            opacity: 0;
            padding-left: 0;
            padding-right: 0;
            border: none;
        }
        
        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden" onload="initApp()">

    <!-- Sidebar Navigation -->
    <div id="sidebar" class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-2xl md:shadow-none" onmouseenter="clearSidebarTimer()" onmouseleave="resetSidebarTimer()">
        <div class="p-4 text-xl font-bold border-b border-gray-700 flex justify-between items-center">
            <span>Nazeer Fresh Food</span>
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white md:hidden p-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scroll">
            <a href="index.html" class="block p-3 md:p-2 hover:bg-gray-700 rounded text-gray-300 transition-colors">Billing</a>
            <a href="material-catalogue.html" class="block p-3 md:p-2 bg-blue-600 rounded text-white font-medium shadow-sm">Material Catalogue</a>
            <a href="customer.html" class="block p-3 md:p-2 hover:bg-gray-700 rounded text-gray-300 transition-colors">Customer</a>
            <a href="cashbook.html" class="block p-3 md:p-2 hover:bg-gray-700 rounded text-gray-300 transition-colors">Cashbook</a>
            <a href="credit-book.html" class="block p-3 md:p-2 hover:bg-gray-700 rounded text-gray-300 transition-colors">Credit Book</a>
        </nav>
        
        <!-- User & Logout Section -->
        <div class="p-4 border-t border-gray-700 flex justify-between items-center bg-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gray-600 flex items-center justify-center font-bold text-sm shadow-inner" id="userAvatar">U</div>
                <div class="text-sm font-semibold truncate w-24" id="userNameDisplay">User</div>
            </div>
            <button onclick="logOut()" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded hover:bg-gray-700" title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto custom-scroll w-full relative">
        <div class="p-4 md:p-6 w-full max-w-7xl mx-auto">
            
            <!-- Header -->
            <div class="flex items-center gap-3 mb-6">
                <button onclick="toggleSidebar()" class="bg-white border p-2 rounded shadow-sm hover:bg-gray-50 text-gray-700" title="Toggle Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h2 class="text-xl md:text-2xl font-bold text-gray-800">Material Catalogue</h2>
            </div>
            
            <!-- Quick Add Material Form -->
            <div class="bg-white p-5 md:p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
                <h3 class="font-bold text-gray-800 border-b pb-2 mb-4">Add New Material</h3>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="newDesc" placeholder="Material Description (Required)" class="border border-gray-300 p-2.5 rounded flex-1 focus:ring-2 focus:ring-blue-500 outline-none">
                    
                    <div class="flex gap-4 md:w-auto w-full">
                        <input type="text" id="newCode" placeholder="Mat. Code" class="border border-gray-300 p-2.5 rounded w-1/2 md:w-32 focus:ring-2 focus:ring-blue-500 outline-none">
                        <select id="newUnit" class="border border-gray-300 p-2.5 rounded w-1/2 md:w-24 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Kg">Kg</option>
                            <option value="Ltr">Ltr</option>
                            <option value="Num">Num</option>
                        </select>
                    </div>
                    
                    <input type="text" id="newCat" placeholder="Category" class="border border-gray-300 p-2.5 rounded w-full md:w-48 focus:ring-2 focus:ring-blue-500 outline-none">
                    
                    <button onclick="addMaterial()" id="saveBtn" class="bg-blue-600 text-white px-6 py-2.5 rounded shadow hover:bg-blue-700 font-bold transition-colors whitespace-nowrap">Save Item</button>
                </div>
            </div>

            <!-- Material Table -->
            <div class="bg-white p-5 md:p-6 rounded-lg shadow-sm border border-gray-200 mb-10">
                <div class="overflow-x-auto rounded-lg border border-gray-200 custom-scroll">
                    <table class="w-full border-collapse text-sm min-w-[700px]">
                        <thead class="bg-gray-50 border-b border-gray-200 text-gray-700">
                            <tr>
                                <th class="p-3 text-left font-semibold">Material Description</th>
                                <th class="p-3 text-left font-semibold w-32">Mat. Code</th>
                                <th class="p-3 text-left font-semibold w-24">Unit</th>
                                <th class="p-3 text-left font-semibold w-48">Category</th>
                                <th class="p-3 text-center font-semibold w-40">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable" class="divide-y divide-gray-200 bg-white">
                            <tr><td colspan="5" class="text-center p-6 text-gray-500">Loading catalog...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const supabaseUrl = 'https://tmrulrlwyspnlwodrjpa.supabase.co'; 
        const supabaseKey = 'sb_publishable_tlacY2KLpvy8YjOYJiCsEA_sP1qA6zS';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let sidebarTimer; 
        let inactivityTimer;

        async function initApp() {
            // Auto-collapse sidebar on mobile load
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
            
            await checkAuth(); 
            setupTimers();
            loadData();
        }

        /* ----- AUTHENTICATION ----- */
        async function checkAuth() {
            const { data } = await supabaseClient.auth.getSession();
            if (!data || !data.session) {
                window.location.href = 'login.html';
                return;
            }
            const userEmail = data.session.user.email;
            const userNameDisplay = userEmail.split('@')[0].toUpperCase();
            document.getElementById('userNameDisplay').innerText = userNameDisplay;
            document.getElementById('userAvatar').innerText = userNameDisplay.charAt(0);
        }

        async function logOut() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        /* ----- TIMERS & SIDEBAR ----- */
        function setupTimers() {
            document.body.addEventListener("mousemove", resetAllTimers);
            document.body.addEventListener("keypress", resetAllTimers);
            document.body.addEventListener("click", resetAllTimers);
            document.body.addEventListener("scroll", resetAllTimers);
            resetAllTimers();
        }

        function resetAllTimers() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(logOut, 30 * 60 * 1000); // 30 min auto-logout
            resetSidebarTimer();
        }

        window.resetSidebarTimer = function() {
            clearTimeout(sidebarTimer);
            sidebarTimer = setTimeout(() => {
                const sb = document.getElementById('sidebar');
                if (sb) sb.classList.add('collapsed');
            }, 30000); 
        }

        window.clearSidebarTimer = function() { clearTimeout(sidebarTimer); }

        window.toggleSidebar = function() {
            const sb = document.getElementById('sidebar');
            if (sb) {
                sb.classList.toggle('collapsed');
                if(!sb.classList.contains('collapsed')) resetSidebarTimer();
                else clearSidebarTimer();
            }
        }

        /* ----- LOAD DATA ----- */
        async function loadData() {
            const { data, error } = await supabaseClient.from('catalog').select('*').order('material_desc');
            const tbody = document.getElementById('dataTable');
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-red-600">Error loading data: ${error.message}</td></tr>`;
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6 text-gray-500">No materials found. Add one above.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(m => {
                // Escape quotes for the onclick function arguments
                const safeDesc = (m.material_desc || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeCode = (m.material_code || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeUnit = (m.unit || 'Kg').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeCat = (m.category || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                return `
                    <tr class="hover:bg-blue-50 transition-colors">
                        <td class="p-3 font-bold text-gray-800">${m.material_desc}</td>
                        <td class="p-3 text-gray-600">${m.material_code || '-'}</td>
                        <td class="p-3 text-gray-600">${m.unit || 'Kg'}</td>
                        <td class="p-3 text-gray-600">
                            ${m.category ? `<span class="bg-gray-100 px-2 py-1 rounded text-xs font-medium border border-gray-200">${m.category}</span>` : '-'}
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="editMaterial(${m.id}, '${safeDesc}', '${safeCode}', '${safeUnit}', '${safeCat}')" class="text-blue-600 hover:text-blue-800 p-1.5 rounded mr-1 transition-colors" title="Edit">✏️ Edit</button>
                            <button onclick="deleteMaterial(${m.id})" class="text-red-600 hover:text-red-800 p-1.5 rounded transition-colors" title="Delete">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        /* ----- ADD MATERIAL ----- */
        async function addMaterial() {
            const desc = document.getElementById('newDesc').value.trim();
            const code = document.getElementById('newCode').value.trim();
            const unit = document.getElementById('newUnit').value;
            const cat = document.getElementById('newCat').value.trim();
            const btn = document.getElementById('saveBtn');

            if (!desc) {
                alert("Material Description is required!");
                return;
            }
            
            btn.disabled = true;
            btn.innerText = "Saving...";

            const { error } = await supabaseClient.from('catalog').insert([{
                material_desc: desc,
                material_code: code,
                unit: unit,
                category: cat
            }]);

            btn.disabled = false;
            btn.innerText = "Save Item";

            if (error) {
                console.error(error);
                alert("Error adding material. A material with this description might already exist.");
            } else {
                // Clear inputs and reload table
                document.getElementById('newDesc').value = '';
                document.getElementById('newCode').value = '';
                document.getElementById('newUnit').value = 'Kg';
                document.getElementById('newCat').value = '';
                loadData();
            }
        }

        /* ----- EDIT MATERIAL ----- */
        async function editMaterial(id, currentDesc, currentCode, currentUnit, currentCat) {
            const newDesc = prompt("Edit Material Description:", currentDesc);
            if (newDesc === null) return; 

            const newCode = prompt("Edit Material Code:", currentCode);
            if (newCode === null) return;

            const newUnit = prompt("Edit Unit (Kg, Ltr, Num):", currentUnit);
            if (newUnit === null) return;

            const newCat = prompt("Edit Category:", currentCat);
            if (newCat === null) return;

            if (newDesc.trim() === '') {
                alert("Material Description cannot be empty.");
                return;
            }

            const { error } = await supabaseClient.from('catalog').update({ 
                material_desc: newDesc.trim(), 
                material_code: newCode.trim(),
                unit: newUnit.trim(),
                category: newCat.trim() 
            }).eq('id', id);

            if (error) {
                console.error(error);
                alert("Error updating material.");
            } else {
                loadData();
            }
        }

        /* ----- DELETE MATERIAL ----- */
        async function deleteMaterial(id) {
            if (!confirm("Are you sure you want to delete this material? This action cannot be undone.")) {
                return;
            }

            const { error } = await supabaseClient.from('catalog').delete().eq('id', id);

            if (error) {
                console.error(error);
                alert("Error deleting material.");
            } else {
                loadData();
            }
        }
    </script>
</body>
</html>
