<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill To - Nazeer Fresh Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex h-screen" onload="loadData()">
    <!-- Sidebar Navigation -->
    <div class="w-64 bg-gray-900 text-white flex flex-col h-full shrink-0">
        <div class="p-4 text-xl font-bold border-b border-gray-700">Nazeer Fresh Food</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Billing</a>
            <a href="bill-to.html" class="block p-2 bg-blue-600 rounded text-white">Bill To</a>
            <a href="deliver-to.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Deliver To</a>
            <a href="cashbook.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Cashbook</a>
            <a href="credit-book.html" class="block p-2 hover:bg-gray-700 rounded text-gray-300">Credit Book</a>
        </nav>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col p-6 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6">Bill To Customer Directory</h2>
        
        <div class="bg-white p-6 rounded shadow">
            
            <!-- Add New Customer Form -->
            <div class="flex gap-2 mb-6 bg-gray-50 p-4 border rounded items-center shadow-sm">
                <span class="font-bold mr-2 text-sm">Add Customer:</span>
                <input type="text" id="newName" placeholder="Customer Name (Required)" class="border p-2 rounded flex-1 text-sm">
                <input type="text" id="newContact" placeholder="Contact Number" class="border p-2 rounded w-48 text-sm">
                <input type="text" id="newAddress" placeholder="Full Address" class="border p-2 rounded flex-1 text-sm">
                <button onclick="addCustomer()" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 text-sm font-bold">Save</button>
            </div>

            <!-- Customer Table -->
            <table class="w-full border-collapse border border-gray-300">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="border p-2 text-left">Customer Name</th>
                        <th class="border p-2 text-left">Contact</th>
                        <th class="border p-2 text-left">Address</th>
                        <th class="border p-2 text-center w-32">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <tr><td colspan="4" class="text-center p-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://tmrulrlwyspnlwodrjpa.supabase.co'; 
        const supabaseKey = 'sb_publishable_tlacY2KLpvy8YjOYJiCsEA_sP1qA6zS';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- LOAD CUSTOMERS ---
        async function loadData() {
            const { data, error } = await supabaseClient.from('bill_to_customers').select('*').order('name');
            const tbody = document.getElementById('dataTable');
            
            if (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-red-600">Error loading data.</td></tr>';
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-gray-500">No customers found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(c => {
                // Escape quotes to prevent breaking the HTML onclick functions
                const safeName = (c.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeContact = (c.contact || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeAddress = (c.address || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="border p-2 font-bold">${c.name}</td>
                        <td class="border p-2">${c.contact || '-'}</td>
                        <td class="border p-2">${c.address || '-'}</td>
                        <td class="border p-2 text-center">
                            <button onclick="editCustomer(${c.id}, '${safeName}', '${safeContact}', '${safeAddress}')" class="text-blue-600 hover:underline mr-3 font-semibold">Edit</button>
                            <button onclick="deleteCustomer(${c.id})" class="text-red-600 hover:underline font-semibold">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- ADD CUSTOMER ---
        async function addCustomer() {
            const name = document.getElementById('newName').value.trim();
            const contact = document.getElementById('newContact').value.trim();
            const address = document.getElementById('newAddress').value.trim();

            if (!name) {
                alert("Customer Name is required!");
                return;
            }

            const { error } = await supabaseClient.from('bill_to_customers').insert([{
                name: name,
                contact: contact,
                address: address
            }]);

            if (error) {
                console.error(error);
                alert("Error adding customer. A customer with this name might already exist.");
            } else {
                // Clear inputs and reload table
                document.getElementById('newName').value = '';
                document.getElementById('newContact').value = '';
                document.getElementById('newAddress').value = '';
                loadData();
            }
        }

        // --- EDIT CUSTOMER ---
        async function editCustomer(id, currentName, currentContact, currentAddress) {
            const newName = prompt("Edit Customer Name:", currentName);
            if (newName === null) return; // User clicked Cancel

            const newContact = prompt("Edit Contact Number:", currentContact);
            if (newContact === null) return;

            const newAddress = prompt("Edit Address:", currentAddress);
            if (newAddress === null) return;

            if (newName.trim() === '') {
                alert("Customer name cannot be empty.");
                return;
            }

            const { error } = await supabaseClient.from('bill_to_customers').update({ 
                name: newName.trim(), 
                contact: newContact.trim(),
                address: newAddress.trim() 
            }).eq('id', id);

            if (error) {
                console.error(error);
                alert("Error updating customer.");
            } else {
                loadData();
            }
        }

        // --- DELETE CUSTOMER ---
        async function deleteCustomer(id) {
            if (!confirm("Are you sure you want to delete this customer?")) {
                return;
            }

            const { error } = await supabaseClient.from('bill_to_customers').delete().eq('id', id);

            if (error) {
                console.error(error);
                alert("Error deleting customer.");
            } else {
                loadData();
            }
        }
    </script>
</body>
</html>
